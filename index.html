<html lang="mr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#a33900" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="श्रावणी टिफीन" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>श्रावणी टिफीन सेंटर</title>
    <meta name="description" content="श्रावणी टिफीन सेंटर - दैनिक टिफीन वाटप, ग्राहक यादी, मासिक बिल आणि व्हॉट्सॲप पावती व्यवस्थापन" />
    <meta property="og:title" content="श्रावणी टिफीन सेंटर" />
    <meta property="og:description" content="श्रावणी टिफीन सेंटर - दैनिक टिफीन वाटप, ग्राहक यादी, मासिक बिल आणि व्हॉट्सॲप पावती व्यवस्थापन" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>
  <body class="bg-[#f8f9ff] text-[#0b1c30] antialiased selection:bg-[#a33900]/20 min-h-screen">
    <div id="root"></div>
    <div
      id="app-splash"
      style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f8f9ff;transition:opacity 0.5s ease;"
    >
      <img
        src="/splash-swami.jpeg"
        alt="श्री स्वामी समर्थ"
        style="width:150px;height:150px;object-fit:cover;border-radius:50%;border:4px solid #a33900;box-shadow:0 10px 30px rgba(163,57,0,0.25);"
      />
      <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:20px;color:#0b1c30;letter-spacing:-0.01em;">
        श्रावणी टिफीन सेंटर
      </div>
      <div style="font-family:'Inter',sans-serif;font-size:13px;color:#5a4138;">श्री स्वामी समर्थ</div>
    </div>
    <script>
      (function () {
        var MIN_DISPLAY_MS = 1800;
        var start = Date.now();
        function hideSplash() {
          var el = document.getElementById('app-splash');
          if (!el) return;
          var wait = Math.max(0, MIN_DISPLAY_MS - (Date.now() - start));
          setTimeout(function () {
            el.style.opacity = '0';
            setTimeout(function () {
              el.remove();
            }, 500);
          }, wait);
        }
        window.addEventListener('load', hideSplash);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
